<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Imprimir Folhas - DataSheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      margin: 0;
      padding: 0;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .toolbar {
      position: fixed;
      top: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(6, 182, 212, 0.4);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 9999px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .toolbar span {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-print {
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }
    .btn-print:hover {
      transform: scale(1.04);
    }
    .btn-close {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-close:hover {
      background: #334155;
      color: #fff;
    }
    .pages-container {
      margin-top: 80px;
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }
    .page-sheet {
      width: 210mm;
      height: 297mm;
      background: white;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .page-sheet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      /* CRÍTICO: Impede interpolação bilinear/bicúbica do navegador ao imprimir */
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    @media print {
      body {
        background: transparent !important;
      }
      .toolbar {
        display: none !important;
      }
      .pages-container {
        margin: 0 !important;
        padding: 0 !important;
        gap: 0 !important;
      }
      .page-sheet {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        page-break-after: always !important;
        break-after: page !important;
      }
      .page-sheet img {
        width: 100% !important;
        height: 100% !important;
        image-rendering: crisp-edges !important;
        image-rendering: pixelated !important;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span>{{ pages|length }} Folha(s) A4 Prontas (Modo Pixel-Perfect)</span>
    <button class="btn-print" onclick="window.print()">
      🖨️ Abrir Diálogo de Impressão (Ctrl + P)
    </button>
    <button class="btn-close" onclick="window.close()">
      Fechar
    </button>
  </div>

  <div class="pages-container">
    {% for page_url in pages %}
    <div class="page-sheet">
      <img src="{{ page_url }}" alt="Folha A4 DataSheet">
    </div>
    {% endfor %}
  </div>

  <script>
    // Dispara automaticamente a caixa de diálogo de impressão ao carregar
    window.addEventListener('load', () => {
      setTimeout(() => {
        window.print();
      }, 400);
    });
  </script>
</body>
</html>
